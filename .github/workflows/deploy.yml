name: Publicar no GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já começou.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Só publica o branch padrão do repositório, seja qual for o nome dele.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Defina a variável SITE_URL do repositório quando o domínio próprio
          # estiver no ar (Settings → Secrets and variables → Actions → Variables).
          # Sem ela, usa a URL do Pages de projeto e o build ajusta o caminho
          # dos assets, o canonical e as tags de compartilhamento sozinho.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: npm run build

      # enablement liga o Pages e troca a origem de "branch" pra "GitHub Actions".
      # Sem isso, um repositório configurado pra publicar a partir do branch serve
      # o index.html cru do código-fonte em vez do build, e a página fica em branco.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
